<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusConnect</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <div class="auth-left-content">
                <div class="logo-large">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Welcome Back!</h1>
                <p>Login to access your college dashboard and stay updated with everything happening around campus.</p>
                <div class="auth-features">
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Class Announcements</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Event Updates</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Academic Notices</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-container">
                <h2>Login to CampusConnect</h2>
                <p class="auth-subtitle">Enter your credentials to continue</p>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="loginEmail" placeholder="your.email@college.edu" required>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="password-field">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> Login As</label>
                        <select id="loginRole" required>
                            <option value="">Select your role</option>
                            <option value="student">🎓 Student</option>
                            <option value="professor">👨‍🏫 Professor</option>
                            <option value="office">🏢 Office Staff</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <!-- Quick Demo Login -->
                <div class="demo-logins">
                    <p>Quick Demo Login:</p>
                    <div class="demo-buttons">
                        <button onclick="demoLogin('student')" class="btn btn-demo student-demo">
                            🎓 Student
                        </button>
                        <button onclick="demoLogin('professor')" class="btn btn-demo prof-demo">
                            👨‍🏫 Professor
                        </button>
                        <button onclick="demoLogin('office')" class="btn btn-demo office-demo">
                            🏢 Office
                        </button>
                    </div>
                </div>

                <p class="auth-switch">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
