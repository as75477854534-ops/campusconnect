<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>

    <!-- Background Glow Effect -->
    <div class="glow-bg"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h2>Welcome Back! 👋</h2>
                <p>Login to access your campus dashboard</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Login <i class="fas fa-arrow-right"></i></button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase Login Logic -->
    <script type="module">
      // Firebase se zaroori cheezein import kar rahe hain
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      // Tumhara Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyBst4nBT298bqRacyxiPC3511Q1vhvVuDA",
        authDomain: "campusconnect-6dbd5.firebaseapp.com",
        databaseURL: "https://campusconnect-6dbd5-default-rtdb.firebaseio.com",
        projectId: "campusconnect-6dbd5",
        storageBucket: "campusconnect-6dbd5.appspot.com",
        messagingSenderId: "1197463812427",
        appId: "1:1197463812427:web:9bdd5a708816c5990f20ce",
        measurementId: "G-FMH93QJ0PW"
      };

      // Firebase ko initialize karo
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Login Button ka Logic
      const loginForm = document.getElementById('loginForm');
      
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Page ko reload hone se rokta hai

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.querySelector('.btn-submit');

        // Button par loading dikhao
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Logging in... <i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        btn.style.opacity = '0.7';

        try {
          // Firebase se login karo
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          
          // Login Successful!
          alert("Login Successful! Welcome " + userCredential.user.email);
          
          // Dashboard par redirect karo
          window.location.href = "dashboard.html"; 
          
        } catch (error) {
          // Agar login fail ho jaye
          let errorMsg = "Login Failed!";
          if (error.code === 'auth/user-not-found') errorMsg = "User not found! Please register first.";
          if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errorMsg = "Wrong email or password!";
          if (error.code === 'auth/invalid-email') errorMsg = "Invalid email format!";
          
          alert(errorMsg);
          
          // Button ko wapas normal karo
          btn.innerHTML = originalText;
          btn.disabled = false;
          btn.style.opacity = '1';
        }
      });
    </script>

    <!-- Password Toggle Script (Eye Icon) -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
