<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="glow-bg"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h2>Welcome Back! 👋</h2>
                <p>Login to access your campus dashboard</p>
            </div>

            <!-- Form ID is loginForm -->
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">Login <i class="fas fa-arrow-right"></i></button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- FIREBASE LOGIN LOGIC (CDN Version - Ye 100% chalega) -->
    <script type="module">
        // CDN se Firebase import kar rahe hain (Bina npm ke ye hi chalta hai)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Tumhari Firebase Keys
        const firebaseConfig = {
            apiKey: "AIzaSyBst4nBT298bqRacyxiPC3511Q1vhvVuDA",
            authDomain: "campusconnect-6dbd5.firebaseapp.com",
            databaseURL: "https://campusconnect-6dbd5-default-rtdb.firebaseio.com",
            projectId: "campusconnect-6dbd5",
            storageBucket: "campusconnect-6dbd5.appspot.com",
            messagingSenderId: "1197463812427",
            appId: "1:1197463812427:web:9bdd5a708816c5990f20ce",
            measurementId: "G-FMH93QJ0PW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Login Form Logic
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Page refresh rokne ke liye

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Button par loading effect
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = 'Logging in... <i class="fas fa-spinner fa-spin"></i>';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';

            try {
                console.log("Trying to login with:", email); // Debugging ke liye
                
                // Firebase Login API call
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                console.log("Login Successful!", user);
                alert("Login Successful! Welcome " + user.email);
                
                // Dashboard par bhejo
                window.location.href = "dashboard.html"; 
                
            } catch (error) {
                console.error("Login Error:", error); // Error console mein dikhega
                
                let errorMsg = "Login Failed!";
                if (error.code === 'auth/user-not-found') errorMsg = "User not found! Please Register first.";
                if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errorMsg = "Wrong password!";
                if (error.code === 'auth/invalid-email') errorMsg = "Invalid email format!";
                
                alert(errorMsg);
                
                // Button wapas normal
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
            }
        });
    </script>

    <!-- Password Toggle Script -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
