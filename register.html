<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusConnect</title>
    <link rel="stylesheet" href="auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left register-left">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <div class="auth-left-content">
                <div class="logo-large">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>Join CampusConnect!</h1>
                <p>Register now and become part of your college's organized communication platform.</p>
                <div class="auth-features">
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Your own class server</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Organized information</span>
                    </div>
                    <div class="auth-feature">
                        <i class="fas fa-check-circle"></i>
                        <span>Never miss updates</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form-container">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Fill in your details to get started</p>
                
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Full Name</label>
                            <input type="text" id="regName" placeholder="Enter your name" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="regEmail" placeholder="your.email@college.edu" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <div class="password-field">
                            <input type="password" id="regPassword" placeholder="Create a strong password" required>
                            <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> Role</label>
                        <select id="regRole" required onchange="handleRoleChange()">
                            <option value="">Select your role</option>
                            <option value="student">🎓 Student</option>
                            <option value="professor">👨‍🏫 Professor</option>
                            <option value="office">🏢 Office Staff</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-building"></i> Department</label>
                            <select id="regDepartment" required>
                                <option value="">Select Department</option>
                                <option value="CSE">Computer Science (CSE)</option>
                                <option value="ECE">Electronics (ECE)</option>
                                <option value="ME">Mechanical (ME)</option>
                                <option value="CE">Civil (CE)</option>
                                <option value="EE">Electrical (EE)</option>
                                <option value="IT">Information Tech (IT)</option>
                                <option value="MBA">MBA</option>
                                <option value="BCA">BCA</option>
                            </select>
                        </div>
                        <div class="form-group" id="yearGroup">
                            <label><i class="fas fa-calendar"></i> Year</label>
                            <select id="regYear" required>
                                <option value="">Select Year</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" id="sectionGroup">
                        <label><i class="fas fa-users"></i> Section</label>
                        <select id="regSection">
                            <option value="">Select Section</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                        </select>
                    </div>

                    <div class="form-group" id="rollGroup">
                        <label><i class="fas fa-id-card"></i> Roll Number / Employee ID</label>
                        <input type="text" id="regRoll" placeholder="Enter your ID">
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </div>
        </div>
    </div>
    <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</body>
</html>
